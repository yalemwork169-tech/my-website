<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightblue;
        }

        nav {
            background-color: black;
            padding: 20px;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-right: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 50px;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 30px;
            margin: 20px auto;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #contact {
            padding: 60px 20px;
            background-color: white;
        }

        input, textarea {
            width: 300px;
            max-width: 80%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
        }

        @media (max-width: 600px) {
            .logo {
                display: block;
                margin-bottom: 15px;
            }

            nav a {
                display: block;
                margin: 10px;
            }

            .hero {
                padding: 50px 15px;
            }

            .hero h1 {
                font-size: 35px;
            }

            .hero p {
                font-size: 18px;
            }

            .card {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <nav>
        <span class="logo">MyWebsite</span>
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero" id="home">
        <h1>Welcome to My Website!</h1>
        <p>This is my first website.</p>
        <button onclick="hello()">Click Me</button>
    </section>

    <section id="services">
        <h2>My Services</h2>

        <div class="card">
            <h2>Website</h2>
            <p>HTML and CSS are fun!</p>
        </div>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>Welcome to my website. I am learning web development.</p>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>

        <form onsubmit="sendMessage(event)">
            <input type="text" id="name" placeholder="Your Name" required>
            <br><br>

            <input type="email" id="email" placeholder="Your Email" required>
            <br><br>

            <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
            <br><br>

            <button type="submit">Send Message</button>
        </form>

        <p id="result"></p>
    </section>

    <script>
        function hello() {
            alert("Hello! Welcome to my website.");
        }

        function sendMessage(event) {
            event.preventDefault();
            document.getElementById("result").innerHTML =
                "Message sent successfully!";
        }
    </script>

</body>
</html>
